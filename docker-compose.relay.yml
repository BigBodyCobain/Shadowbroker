# Minimal relay-node compose — backend only, no frontend needed.
services:
  backend:
    image: ghcr.io/bigbodycobain/shadowbroker-backend:latest
    container_name: shadowbroker-relay
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Keep Tor wormhole up across redeploys (no NODE UI on headless relay).
      MESH_INFONET_RELAY_AUTO_WORMHOLE: "true"
      MESH_ARTI_ENABLED: "true"
      # A relay serves the mesh only: skip the map-data fetchers (about 1.5 GB
      # and 30-50% CPU) but keep the Infonet sync workers running.
      MESH_ONLY: "${MESH_ONLY:-true}"
      SHADOWBROKER_MESH_NODE_RUNTIME: "${SHADOWBROKER_MESH_NODE_RUNTIME:-true}"
    volumes:
      - relay_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  relay_data:
