# Deploy override for a frontend image that needs the root-level
# qdev-project.json while building its public contracts. Pair this with the
# runtime compose file, whose working directory is ops/shadow.qdev.run.
services:
  backend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
    deploy:
      resources:
        limits:
          # The origin's Docker daemon is allocated one CPU.
          cpus: "1.0"

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        # Keep the server-rendered shell and the browser on the same public
        # projection. Without this build-time value, SSR renders operator UI
        # while the browser switches to read-only mode by hostname.
        NEXT_PUBLIC_PUBLIC_READ_ONLY: "true"
