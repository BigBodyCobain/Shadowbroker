version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # @types/node tracks the Node runtime we ship (24.x in both images and CI);
    # newer majors describe APIs that don't exist at runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-runtime-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  # uv (not pip) so Python bumps update uv.lock as well as pyproject.toml.
  # Docker and CI install from the lock with --frozen; a pyproject-only bump
  # passes CI without ever installing the new version.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "weekly"
    # Runtime version jumps are planned on purpose, not taken from a weekly
    # bump: Node is pinned to the same LTS line in both images and CI, and a
    # new Python minor needs wheels for every dependency (e.g. pyproj) first.
    # Patch updates still come through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
