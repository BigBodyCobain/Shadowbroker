  - id: nc-carolina-beach-wrightsville-beach
    name: Carolina Beach / Wrightsville Beach
    state: NC
    priority: 0
    service_area:
      bbox: [-77.96, 34.02, -77.73, 34.26]
      focus_places:
        - Carolina Beach
        - Kure Beach
        - Wrightsville Beach
        - Masonboro Island vicinity
        - Snow's Cut
        - Pleasure Island
    homeoffice_context:
      base_area: Carolina Beach
      exact_address: local_private_only
      private_note_path: .local-docs/business-intel/private-homeoffice.md
    notes:
      - Homeoffice computer and TV dashboard are based in Carolina Beach.
      - Carolina Beach states that New Hanover County Building Safety issues residential/commercial building permits and trade permits in town.
      - Carolina Beach town permits include residential fence, driveway/hardscaping, fill/grade/clear, small accessory structures, fire permits, business registration, sidewalk cafe, vending/beach services, and temporary signs.
      - Carolina Beach publishes an active/under-construction Development Permits map backed by Cityworks FeatureServer layers.
      - Wrightsville Beach says it maps active permits daily by calendar year and publishes a permit map through Google My Maps/KML.
      - Coastal permits, CAMA, docks, bulkheads, flood requirements, stormwater, and elevation/renovation work are unusually important in these beach markets.
    sources:
      - id: carolina-beach-building-zoning-permits-page
        name: Carolina Beach Building & Zoning Permits
        category: permit_reference
        access_method: official_reference_page
        url: https://www.carolinabeach.gov/256/Building-Zoning-Permits
        enabled: true
        cadence: manual_review
        terms_reviewed: false
        commercial_use: reference_only
        attribution: Town of Carolina Beach / New Hanover County Building Safety
        notes:
          - Official page states NHC Building Safety issues residential/commercial building permits and trade permits for Carolina Beach.
          - Official page lists town permits that can be submitted through the Carolina Beach online permitting portal.

      - id: carolina-beach-apply-permit-page
        name: Carolina Beach Apply for a Permit
        category: permit_reference
        access_method: official_reference_page
        url: https://www.carolinabeach.gov/257/Apply-for-a-Permit
        enabled: true
        cadence: manual_review
        terms_reviewed: false
        commercial_use: reference_only
        attribution: Town of Carolina Beach
        notes:
          - Building permits route through New Hanover County COAST.
          - Other town permits route through the Town of Carolina Beach online permitting portal.

